name: Feature Branch PR CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  validate-and-build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Setup node and npm
        uses: volta-cli/action@v5.0.0

      - name: Cache npm global store
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Turborepo Artifacts
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Format and Lint
        run: npm run format-and-lint

      - name: Type Check
        run: npm run check-types -- --cache-dir=".turbo"

      - name: Build Application
        run: npm run build -- --cache-dir=".turbo"
